<style>
:root{--body:#c8102e;--body-d:#8f0a20;--lcd:#9bbc0f;--lcd-m:#8bac0f;--ink:#0f380f;--ink-s:#306230;--bg:#2b2b2b;--btn:#f3f3f3;--btn-t:#222;--blue:#3aa0ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--body:#a50d27;--body-d:#6e0817}}
:root[data-theme="dark"]{--bg:#111;--body:#a50d27;--body-d:#6e0817}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:"VT323","Courier New",monospace;font-size:21px;color:var(--ink)}
.dex{height:100%;max-width:520px;margin:0 auto;background:var(--body);display:flex;flex-direction:column;border-left:4px solid var(--body-d);border-right:4px solid var(--body-d)}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:4px solid var(--body-d)}
.lens{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfe3ff,var(--blue) 45%,#0b5cad);border:4px solid #fff;flex:none}
.led{width:13px;height:13px;border-radius:50%;border:2px solid #222;flex:none}
.top h1{font:14px/1.2 "Press Start 2P","Courier New",monospace;color:#fff;margin:0 0 0 auto;text-shadow:2px 2px 0 var(--body-d)}
.logo{height:34px;width:auto}
.frame{flex:1;min-height:0;margin:12px 14px 6px;background:#d9d9d9;border-radius:10px 10px 10px 40px;padding:12px 12px 18px;border:3px solid #999;display:flex}
.screen{flex:1;overflow-y:auto;background:var(--lcd);border:4px solid var(--ink-s);border-radius:4px;padding:10px;box-shadow:inset 0 0 18px rgba(15,56,15,.45)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 14px 14px}
.nav button{font:9px/1.3 "Press Start 2P","Courier New",monospace;background:var(--btn);color:var(--btn-t);border:0;border-bottom:4px solid #999;border-radius:8px;padding:11px 2px;min-height:44px}
.nav button.on{background:#ffd23f}
.nav .add{background:#2fbf71;color:#fff;border-bottom-color:#1c7d49}
h2{font:12px/1.5 "Press Start 2P","Courier New",monospace;margin:4px 0 10px}
h3{font:10px/1.5 "Press Start 2P","Courier New",monospace;margin:14px 0 8px;color:var(--ink-s)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tile{background:var(--lcd-m);border:2px solid var(--ink);padding:6px 2px;text-align:center;font:inherit;color:var(--ink);line-height:1.05;min-height:84px}
.tile .n{font:7px "Press Start 2P",monospace;display:block;margin-bottom:3px}
.tile .f{font-size:30px;display:block}
.tile.lock .f{filter:brightness(0) contrast(.6);opacity:.35}
.tile.lock{border-style:dashed;opacity:.8}
.tile.pop{animation:pop .6s}
@keyframes pop{30%{transform:scale(1.15);background:#d4ff5a}}
@media (prefers-reduced-motion:reduce){.tile.pop{animation:none}}
.row{display:flex;align-items:center;gap:10px;width:100%;background:var(--lcd-m);border:2px solid var(--ink);padding:7px 9px;margin-bottom:7px;font:inherit;color:var(--ink);text-align:left}
.row .e{font-size:30px}
.row .m{flex:1;min-width:0}.row b{font-weight:400;font-size:24px;display:block}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0}.bar span{width:110px}
.bar i{flex:1;height:12px;border:2px solid var(--ink);display:flex}.bar u{background:var(--ink);display:block}
.badge{display:inline-block;border:2px solid var(--ink);padding:0 7px;margin:0 5px 5px 0;background:var(--ink);color:var(--lcd)}
.r1{--rc:#7d8f6a;--rt:#0f380f}.r2{--rc:#2e9b4e;--rt:#fff}.r3{--rc:#2f6fe0;--rt:#fff}.r4{--rc:#8a3fd1;--rt:#fff}.r5{--rc:#ffc400;--rt:#3a2300}
.rar{letter-spacing:1px}
.row{border-left:10px solid var(--rc,var(--ink))}
.rchip{display:inline-block;background:var(--rc);color:var(--rt);font:8px/1 "Press Start 2P",monospace;padding:4px 6px;margin-left:6px}
.rban{background:var(--rc);color:var(--rt);text-align:center;padding:12px 6px;margin:10px 0;border:3px solid var(--ink)}
.rban b{display:block;font:12px/1.5 "Press Start 2P",monospace;font-weight:400}
.rban .st{font-size:30px;letter-spacing:3px;display:block}
.rban.r5{background:linear-gradient(110deg,#ffb300,#fff2a0 45%,#ffb300 60%);background-size:250% 100%;animation:shine 2.4s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
@media (prefers-reduced-motion:reduce){.rban.r5{animation:none}}
.cnt{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.cnt span{background:var(--rc);color:var(--rt);padding:1px 7px;font-size:19px}
.box{border:2px solid var(--ink);padding:8px;margin:10px 0;background:var(--lcd-m)}
.btn{font:9px/1.4 "Press Start 2P","Courier New",monospace;background:var(--ink);color:var(--lcd);border:0;padding:11px 12px;margin:4px 6px 4px 0;min-height:42px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
label{display:block;margin:10px 0 2px}
input,select,textarea{width:100%;font:inherit;font-size:21px;background:var(--lcd-m);color:var(--ink);border:2px solid var(--ink);padding:5px 7px;border-radius:0}
textarea{min-height:80px;resize:vertical}
input[type=range]{padding:0;accent-color:var(--ink)}
.med{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--ink-s)}
.med .e{font-size:30px;width:40px;text-align:center}.med.lock .e{filter:grayscale(1) brightness(.4);opacity:.4}.med.lock{opacity:.6}
.med small{display:block;font-size:18px;color:var(--ink-s)}
.chips span{display:inline-block;border:1px solid var(--ink);padding:0 5px;margin:0 4px 4px 0;font-size:18px}.chips .x{opacity:.35;border-style:dashed}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--lcd);padding:10px 14px;max-width:88%;text-align:center;border:3px solid var(--lcd);display:none;z-index:5}
.muted{color:var(--ink-s)}
.pk{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.pk span{cursor:pointer;border:2px solid var(--ink);padding:3px 8px;background:var(--lcd-m);font-size:20px;user-select:none}.pk span.on{background:var(--ink);color:var(--lcd)}
.pk.em{max-height:190px;overflow-y:auto;border:2px solid var(--ink);padding:4px}.pk.em span{font-size:26px;padding:2px 5px;border-color:transparent;background:transparent}.pk.em span.on{background:var(--ink);border-color:var(--ink)}
.sw{display:flex;gap:10px;align-items:center}.sw input{width:26px;height:26px;flex:none}
</style>
</head>

let mfUrl;
function pwa(color){const name=db.set.title||(db.set.male?"Boydex":"Hoekédex");
  document.title=name;document.querySelector("meta[name=apple-mobile-web-app-title]").content=name;
  const mf={name,short_name:name.slice(0,12),start_url:location.href.split("#")[0],display:"standalone",orientation:"portrait",background_color:color,theme_color:color,icons:[{src:ICON192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:ICON512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
  try{const u=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:"application/manifest+json"}));let l=document.querySelector("link[rel=manifest]");if(!l){l=document.createElement("link");l.rel="manifest";document.head.appendChild(l)}l.href=u;if(mfUrl)URL.revokeObjectURL(mfUrl);mfUrl=u}catch(e){}}
function setOpt(k,v){db.set[k]=v;save();applyMode();render()}


function render(){
  const s=$("#scr");const [v,a]=view.split(":");
  if(db.pin&&!unlockedSess){$("#nav").style.visibility="hidden";s.innerHTML=lockV();return}
  $("#nav").style.visibility="visible";
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v.split(":")[0]===v||(v==="type"&&b.dataset.v==="dex")));
  s.innerHTML=({dex:dexV,type:typeV,card:cardV,form:formV,medals:medV,set:setV})[v](a);s.scrollTop=0;
  if(v==="form")regToggle();
}
function go(v){view=v;delArm="";render()}
function lockV(){return `<h2>BLOCCATO</h2><p>Inserisci il PIN per aprire il Ragadex.</p><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button class="btn" onclick="unlock()">Sblocca</button>`}
function unlock(){if(hash($("#pin").value)===db.pin){unlockedSess=true;render()}else toast("PIN errato")}

function dexV(){
  const u=unl();let h=`<h2>SLOT ${u.size}/${T.length+1} · SCHEDE ${db.cards.length}</h2><div class="cnt">${[1,2,3,4,5].map(r=>`<span class="r${r}">${r}★ ${db.cards.filter(c=>rar(c)===r).length}</span>`).join("")}</div>`;
  if(!db.cards.length)h+=`<div class="box">Nessuna scheda ancora. Tocca + NUOVA per registrare la prima e sbloccare il primo slot.</div>`;
  G.forEach((g,gi)=>{h+=`<h3>${esc(g)}</h3><div class="grid">`;
    T.filter(t=>t[3]===gi).forEach(t=>{const i=T.indexOf(t)+1,n=cardsOf(t[0]).length,ok=u.has(t[0]);
      h+=`<button class="tile ${ok?"":"lock"} ${justNew===t[0]?"pop":""}" ${ok?`onclick="go('type:${t[0]}')"`:`onclick="toast('Slot bloccato: registra una scheda ${esc(t[1])}')"`}><span class="n">#${String(i).padStart(3,"0")}</span><span class="f">${t[2]}</span>${ok?esc(t[1])+`<br>×${n}`:"???"}</button>`});
    h+=`</div>`});
  const hn=cardsOf("HY").length,hk=u.has("HY");
  h+=`<h3>${HY[1]}</h3><div class="grid"><button class="tile ${hk?"":"lock"} ${justNew==="HY"?"pop":""}" onclick="${hk?"go('type:HY')":"toast('Slot bloccato: registra una scheda con doppia origine')"}"><span class="n">#${String(T.length+1).padStart(3,"0")}</span><span class="f">🧬</span>${hk?HY[1]+"<br>×"+hn:"???"}</button></div>`;
  justNew="";return h}

function typeV(id){const t=tp(id),l=cardsOf(id);
  let h=`<button class="btn alt" onclick="go('dex')">◀ Dex</button><h2>${t[2]} ${esc(t[1])}</h2><p class="muted">${id==="HY"?"Doppia origine":"Area: "+esc(G[t[3]])+" · Rarità base "+RL[t[4]]}<br>Schede: ${l.length}</p><div class="box" style="white-space:pre-wrap">${esc(DESC[id]||"Descrizione in arrivo.")}</div>`;
  if(id==="IT"){const r=regs();h+=`<h3>Sotto-dex regioni ${r.size}/20</h3><div class="chips">${REG.map(x=>`<span class="${r.has(x)?"":"x"}">${r.has(x)?esc(x):"???"}</span>`).join("")}</div>`}
  return h+l.map(cardRow).join("")}
function cardRow(c){const r=rar(c);return `<button class="row r${r}" onclick="go('card:${c.id}')"><span class="e">${esc(c.emo)}</span><span class="m"><b>${esc(c.nick)} ${c.s?tp(c.p)[2]+tp(c.s)[2]:""}</b><span class="rar">${stars(r)}</span><span class="rchip">${RL[r].toUpperCase()}</span></span></button>`}

function cardV(id){const c=db.cards.find(x=>x.id===id);if(!c)return dexV();
  const badge=k=>{const t=tp(k);return `<span class="badge">${t[2]} ${esc(t[1])}</span>`};
  return `<button class="btn alt" onclick="go('type:${c.s?"HY":c.p}')">◀ Indietro</button>
  <h2>${esc(c.emo)} ${esc(c.nick)}</h2>${badge(c.p)}${c.s?badge(c.s):""}
  <div class="rban r${rar(c)}"><span class="st">${stars(rar(c))}</span><b>${RL[rar(c)].toUpperCase()}</b></div><div class="muted">Base ${rbase(c)}★${rmods(c).map(x=>" · "+x[0]+" "+(x[2]>0?"+":"−")+Math.abs(x[2])).join("")}</div>
  ${(c.tr||[]).length?`<div class="pk" style="margin:6px 0">${c.tr.map(k=>`<span class="on">${esc(trl(k))}</span>`).join("")}</div>`:""}
  ${c.reg?`<div class="muted">Regione: ${esc(c.reg)}</div>`:""}
  <div class="muted">${db.set.male?"Incontrato":"Incontrata"} il ${esc(c.date||"?")}</div>
  <div class="box">${esc([c.p,c.s,c.s?"HY":""].filter(Boolean).map(k=>DESC[k]).concat((c.tr||[]).map(k=>TDESC[k])).filter(Boolean).join(" ")||"Descrizione in arrivo.")}</div>
  <button class="btn" onclick="go('form:${c.id}')">Modifica</button>
  <button class="btn alt" onclick="del('${c.id}')">${delArm===c.id?"Tocca ancora per eliminare":"Elimina"}</button>`}
function del(id){if(delArm!==id){delArm=id;render();return}db.cards=db.cards.filter(c=>c.id!==id);save();go("dex");toast("Scheda eliminata")}

function opts(sel,none){return (none?`<option value="">— nessuna —</option>`:"")+G.map((g,gi)=>`<optgroup label="${esc(g)}">${T.filter(t=>t[3]===gi).map(t=>`<option value="${t[0]}" ${t[0]===sel?"selected":""}>${t[2]} ${esc(t[1])}</option>`).join("")}</optgroup>`).join("")}
function formV(id){
  const c=db.cards.find(x=>x.id===id)||{id:"",nick:"",p:"IT",s:"",date:new Date().toISOString().slice(0,10),reg:"",emo:EMOS[0]};
  return `<h2>${c.id?"MODIFICA":"NUOVA"} SCHEDA</h2>
  <label>Soprannome</label><input id="f_nick" maxlength="40" value="${esc(c.nick)}" placeholder="Nome in codice">
  <label>Avatar</label><input type="hidden" id="f_emo" value="${esc(c.emo)}"><div class="pk em">${EMOS.map(e=>`<span class="${e===c.emo?"on":""}" onclick="pickEmo(this)">${e}</span>`).join("")}</div><label>Caratteristiche</label><div class="pk" id="trs"><span class="${(c.tr||[]).length?"":"on"}" data-t="" onclick="togT(this)">Nessuna</span>${TR.map(t=>`<span class="${(c.tr||[]).includes(t[0])?"on":""}" data-t="${t[0]}" onclick="togT(this)">${t[1]} ${t[2]}</span>`).join("")}</div>
  <label>Origine primaria</label><select id="f_p" onchange="regToggle()">${opts(c.p)}</select>
  <label style="display:flex;gap:10px;align-items:center;margin-top:12px"><input type="checkbox" id="f_dbl" ${c.s?"checked":""} onchange="regToggle()" style="width:26px;height:26px;flex:none"> Ha doppia origine? (slot ${HY[1]})</label><div id="srow"><label>Seconda origine</label><select id="f_s" onchange="regToggle()">${opts(c.s)}</select></div>
  <div id="regrow"><label>Regione italiana</label><select id="f_reg"><option value="">— non so —</option>${REG.map(r=>`<option ${r===c.reg?"selected":""}>${esc(r)}</option>`).join("")}</select></div>
  <label>Data incontro</label><input id="f_date" type="date" value="${esc(c.date)}">
  <button class="btn" onclick="saveCard('${c.id}')">Salva scheda</button><button class="btn alt" onclick="go('dex')">Annulla</button>`}
function pickEmo(el){document.querySelectorAll(".pk.em span").forEach(x=>x.classList.remove("on"));el.classList.add("on");$("#f_emo").value=el.textContent}
function togT(el){const all=[...document.querySelectorAll("#trs span")];if(!el.dataset.t){all.forEach(x=>x.classList.remove("on"));el.classList.add("on");return}el.classList.toggle("on");all[0].classList.toggle("on",!all.slice(1).some(x=>x.classList.contains("on")))}
function regToggle(){const d=$("#f_dbl").checked;$("#srow").style.display=d?"block":"none";const r=$("#regrow");if(r)r.style.display=($("#f_p").value==="IT"||(d&&$("#f_s").value==="IT"))?"block":"none"}
function saveCard(id){
  const nick=$("#f_nick").value.trim();if(!nick){toast("Serve un soprannome");return}
  const ev=$("#f_emo").value.trim();let em=ev;try{em=[...new Intl.Segmenter().segment(ev)][0].segment}catch(x){}em=em||EMOS[0];
  const p=$("#f_p").value;let s=$("#f_dbl").checked?$("#f_s").value:"";if(s===p)s="";
  const c={id:id||("c"+Date.now().toString(36)),nick,emo:em,p,s,reg:(p==="IT"||s==="IT")?$("#f_reg").value:"",date:$("#f_date").value,tr:[...document.querySelectorAll("#trs span.on")].map(x=>x.dataset.t).filter(Boolean)};
  const u0=unl(),m0=earned();
  const i=db.cards.findIndex(x=>x.id===c.id);if(i>=0)db.cards[i]=c;else db.cards.push(c);
  save();const u1=unl(),m1=earned(),msg=[];
  [...u1].filter(x=>!u0.has(x)).forEach(x=>{msg.push("Nuovo slot sbloccato: "+tp(x)[1]+"!");justNew=x});
  MED.filter(m=>m1.has(m[0])&&!m0.has(m[0])).forEach(m=>msg.push("Medaglia: "+m[2]+" "+m[1]));
  msg.push("Rarità: "+RL[rar(c)]);
  view="card:"+c.id;render();toast(msg.join(" · "))}

function medV(){const e=earned();return `<h2>MEDAGLIE ${e.size}/${MED.length}</h2>`+MED.map(m=>e.has(m[0])?`<div class="med"><span class="e">${m[1]}</span><div><b>${esc(m[2])}</b><small>${esc(m[3])}</small></div></div>`:`<div class="med lock"><span class="e">❔</span><div><b>???</b><small>${db.set.hint?esc(m[3]):"Medaglia segreta"}</small></div></div>`).join("")}

function setV(){const S=db.set;return `<h2>OPZIONI</h2>
  <label class="sw"><input type="checkbox" ${S.male?"checked":""} onchange="setOpt('male',this.checked)"> Mi piacciono i maschi</label>
  <label class="sw"><input type="checkbox" ${S.hint?"checked":""} onchange="setOpt('hint',this.checked)"> Mostra gli obiettivi delle medaglie</label>
  <h3>Colore</h3><div class="pk">${Object.keys(THEMES).map(k=>`<span class="${S.theme===k?"on":""}" onclick="setOpt('theme','${k}')">${THEMES[k][2]}</span>`).join("")}</div>`}
function cp(){const t=$("#exp");t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast("Backup copiato"),()=>{document.execCommand("copy");toast("Backup copiato")})}catch(e){try{document.execCommand("copy");toast("Backup copiato")}catch(x){toast("Seleziona e copia a mano")}}}
function imp(){try{let a=JSON.parse($("#imp").value),st=null;if(!Array.isArray(a)){st=a.set;a=a.cards}if(!Array.isArray(a)||a.some(c=>!c.id||!tp(c.p)))throw 0;db.cards=a;if(st)Object.assign(db.set,st);save();applyMode();go("dex");toast("Ripristinate "+a.length+" schede")}catch(e){toast("Backup non valido")}}

document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.v)});
applyMode();render();
